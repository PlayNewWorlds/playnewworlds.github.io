name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  # GUT (Godot Unit Test) version. Pinned rather than "latest" since GUT
  # 9.5.0+ requires Godot 4.5+; bump this only alongside GODOT_VERSION.
  GUT_VERSION: v9.3.0
  # The GitHub Pages repo this pipeline publishes the Web build to.
  PAGES_REPO: PlayNewWorlds/playnewworlds.github.io

permissions:
  contents: read

jobs:
  lint:
    name: Lint (gdlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run gdlint
        run: gdlint .

  test:
    name: Test (GUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Install GUT
        run: |
          git clone --depth 1 --branch "$GUT_VERSION" https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/gut

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit

  build:
    name: Build (Web export)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export Web build
        run: |
          export GODOT_BIN="$(command -v godot)"
          ./export-web.sh

      - name: Publish to ${{ env.PAGES_REPO }}
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PAGES_DEPLOY_TOKEN:-}" ]]; then
            echo "PAGES_DEPLOY_TOKEN secret is not set - see README for setup." >&2
            exit 1
          fi

          pages_dir="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${PAGES_REPO}.git" \
            "$pages_dir"

          # Replace the published repo's entire contents with this build -
          # it's a generated artifact, nothing there is hand-maintained.
          find "$pages_dir" -mindepth 1 -maxdepth 1 -not -name ".git" -exec rm -rf {} +
          cp -r build/web/. "$pages_dir/"
          touch "$pages_dir/.nojekyll"

          cd "$pages_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged, nothing to publish."
            exit 0
          fi
          git commit -m "Publish build from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:master
